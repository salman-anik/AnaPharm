name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AnaPharm-v1.0.0.apk

      - name: Upload Standalone APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnaPharm-Android-APK
          path: AnaPharm-v1.0.0.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "AnaPharm v1.0.0 (Android APK)"
          draft: false
          prerelease: false
          body: |
            ## 📱 AnaPharm Mobile v1.0.0
            Download and install the standalone Android APK directly on your phone!

            ### ✨ Key Features:
            - **Interactive 3D Human Anatomy:** Full body with 360° orbital rotation, zoom, and layer dissection.
            - **Physiological Simulations:** Heart rate animation, lung pulmonary respiration, and circulating blood particles.
            - **2,594 Clinical Generics & 33,200+ BD Brands:** Complete medicine monographs with generic indications, mechanisms of action, dosage guidelines, side effects, precautions, and commercial brands (Napa, Seclo, Nexum, etc.).
            - **Bilingual Interface:** Instant interactive toggle between 🇧🇩 বাংলা and 🇬🇧 English.
            - **Dual Theme:** Dark Mode and Light Mode with medical studio lighting.
          files: AnaPharm-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
